<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anna Memory — V1 Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap');

  :root {
    --sage-50:#F2F6F4; --sage-100:#E5EBE8; --sage-200:#D5E0DA; --sage-300:#A8C5B8;
    --sage-400:#92B3A3; --sage-500:#7C9A8E; --sage:#7C9A8E; --sage-600:#6A8A7D;
    --sage-700:#5A7A6E; --sage-800:#435C52; --sage-900:#2C3E36;
    --coral:#E8A598;
    --cream:#FAF8F5; --warm-white:#FFFEFC; --cream-200:#F0ECE6; --cream-300:#E4DFD8;
    --soft-gray:#F5F3F0; --warm-gray:#ECEAE7;
    --text-primary:#2D3436; --text-secondary:#636E72; --text-muted:#B2BEC3;
    --shadow-soft-sm: 0 1px 4px rgba(90,122,110,0.10);
    --shadow-soft: 0 6px 24px rgba(90,122,110,0.16);
    --shadow-phone: 0 24px 70px rgba(44,62,54,0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #EEF3F0 0%, #E7EAE6 60%, #E2E4E0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    color: var(--text-primary);
  }

  .caption {
    text-align: center;
    margin-bottom: 26px;
    max-width: 420px;
  }
  .caption h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--sage-900);
  }
  .caption p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .caption .meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* ---- phone frame ---- */
  .phone {
    width: 390px;
    height: min(820px, calc(100vh - 200px));
    min-height: 560px;
    background: var(--cream);
    border-radius: 44px;
    box-shadow: var(--shadow-phone);
    border: 1px solid rgba(255,255,255,0.6);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--cream);
  }

  /* ---- shared ---- */
  .chip {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--cream-200);
    color: var(--sage-800);
  }
  .recency { font-size: 11px; color: var(--text-muted); }

  /* ---- header ---- */
  .header { flex-shrink: 0; padding-top: 26px; }
  .header h1.page-title {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 600;
    padding: 0 20px;
    color: var(--text-primary);
  }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 20px 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    background: var(--warm-white);
    color: var(--text-primary);
    box-shadow: var(--shadow-soft-sm);
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s ease;
  }
  .tab:active { transform: scale(0.98); }
  .tab.active { background: var(--sage-700); color: #fff; }
  .tab svg { width: 16px; height: 16px; flex-shrink: 0; }
  .tab .label { font-size: 13px; font-weight: 600; }
  .tab .count { font-size: 11px; font-weight: 600; opacity: 0.55; }

  /* ---- list ---- */
  .list-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .list-area::-webkit-scrollbar { width: 4px; }
  .list-area::-webkit-scrollbar-thumb { background: var(--sage-300); border-radius: 2px; }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 10px;
  }
  .item {
    width: 100%;
    border: none;
    text-align: left;
    border-radius: 12px;
    padding: 14px;
    background: var(--warm-white);
    box-shadow: var(--shadow-soft-sm);
    cursor: pointer;
    margin-bottom: 8px;
    display: block;
    font-family: inherit;
    transition: transform 0.1s ease;
  }
  .item:active { transform: scale(0.99); }
  .item-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .item-main { min-width: 0; flex: 1; }
  .item-meta { display: flex; align-items: center; gap: 8px; }
  .item-title {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text-primary);
  }
  .item-summary {
    margin-top: 4px;
    font-size: 13px;
    line-height: 1.35;
    color: var(--text-secondary);
  }
  .chevron { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; margin-top: 2px; }

  /* ---- composer ---- */
  .composer-wrap {
    flex-shrink: 0;
    border-top: 1px solid var(--cream-300);
    padding: 12px 20px;
    background: var(--cream);
  }
  .scoped-label {
    font-size: 12px;
    color: var(--sage-700);
    padding: 0 4px 6px;
  }
  .scoped-label b { font-weight: 600; }
  .composer {
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 16px;
    padding: 8px 10px;
    background: var(--warm-white);
    border: 1px solid var(--cream-300);
    box-shadow: var(--shadow-soft-sm);
  }
  .icon-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    border: none;
    background: transparent;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--sage-700);
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .composer input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-primary);
    padding: 6px 2px;
  }
  .composer input::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    border: none;
    border-radius: 999px;
    background: var(--sage);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .send-btn svg { width: 20px; height: 20px; color: #fff; }
  .send-btn:disabled { opacity: 0.35; cursor: default; }

  /* ---- item preview ---- */
  .back-row { flex-shrink: 0; padding: 26px 20px 4px; }
  .back-btn {
    display: flex; align-items: center; gap: 4px;
    border: none; background: transparent;
    color: var(--sage-700);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
    padding: 4px;
    margin-left: -4px;
  }
  .back-btn svg { width: 16px; height: 16px; }
  .preview-area { flex: 1; overflow-y: auto; padding: 12px 20px 16px; }
  .preview-area::-webkit-scrollbar { width: 4px; }
  .preview-area::-webkit-scrollbar-thumb { background: var(--sage-300); border-radius: 2px; }
  .preview-title {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--text-primary);
    margin-top: 8px;
  }
  .preview-card {
    margin-top: 12px;
    border-radius: 16px;
    padding: 16px;
    background: var(--warm-white);
    box-shadow: var(--shadow-soft-sm);
  }
  .preview-card ul { list-style: none; }
  .preview-card li {
    display: flex;
    gap: 8px;
    font-size: 13px;
    line-height: 1.4;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .preview-card li:last-child { margin-bottom: 0; }
  .preview-card li .bullet { color: var(--sage-400); }
  .photo-block {
    margin-top: 12px;
    aspect-ratio: 4 / 3;
    border-radius: 16px;
    background: var(--sage-50);
    display: flex; align-items: center; justify-content: center;
  }
  .photo-block svg { width: 40px; height: 40px; color: var(--sage-300); }
  .doc-block {
    margin-top: 12px;
    display: flex; align-items: center; gap: 12px;
    border-radius: 16px;
    padding: 16px;
    background: var(--warm-white);
    box-shadow: var(--shadow-soft-sm);
  }
  .doc-icon {
    width: 44px; height: 44px;
    flex-shrink: 0;
    border-radius: 12px;
    background: var(--sage-50);
    display: flex; align-items: center; justify-content: center;
  }
  .doc-icon svg { width: 20px; height: 20px; color: var(--sage-700); }
  .doc-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .doc-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .source-line {
    margin-top: 10px;
    padding: 0 4px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ---- bottom nav ---- */
  .bottomnav {
    flex-shrink: 0;
    display: flex;
    background: var(--warm-white);
    border-top: 1px solid var(--cream-300);
    padding: 8px 0 14px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
  }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-item .nav-label { font-size: 11px; }
  .nav-item.active { color: var(--sage-700); }
</style>
</head>
<body>

  <div class="caption">
    <h1>Anna Memory — V1 Prototype</h1>
    <p>Tap the section tabs, open any item, use the back arrow.</p>
    <p class="meta">Mock data. Frontend only — nothing is wired to a backend.</p>
  </div>

  <div class="phone">
    <div class="screen" id="screen"></div>
    <div class="bottomnav" id="bottomnav"></div>
  </div>

<script>
  // ---- icons (lucide-style) ----
  const I = {
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M12 14a2 2 0 1 0 0 4"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>',
    paperclip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
    arrowUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>',
    arrowLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
    brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.142 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.142 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/></svg>',
    cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
  };

  // ---- sections ----
  const sections = [
    { id: 'kept', title: 'Things I told you to keep', short: 'Kept', icon: 'list' },
    { id: 'known', title: 'Things you know about me', short: 'Known', icon: 'user' },
    { id: 'workflows', title: 'My workflows', short: 'Workflows', icon: 'calendar' },
    { id: 'made', title: "Things you've made for me", short: 'Made', icon: 'file' }
  ];

  // ---- mock data ----
  const memories = [
    { id:'eva-invitees', section:'kept', title:"Eva's birthday invitees", summary:"School friends, cousins, and last year's final list.", label:'List', source:'You told Anna', updated:'Updated Apr 12',
      preview:['Mia (school)','Charlotte (school)','Oliver (cousin)','Ruby (cousin)','Jack (swim club)',"+ 6 more carried over from last year's list"] },
    { id:'bali-packing', section:'kept', title:'Bali packing list', summary:'Docs, medication, sun gear, chargers, flight snacks.', label:'List', source:'You told Anna', updated:'Updated Apr 8',
      preview:['Passports + travel documents','Sunscreen, hats, rash vests',"Eva's inhaler + medication",'Chargers + travel adapters','Snacks for the flight'] },
    { id:'theo-gifts', section:'kept', title:"Theo's gift ideas", summary:'A running list of things Theo would love.', label:'List', source:'You told Anna', updated:'Updated Mar 30',
      preview:['Lego Botanicals set','Soccer ball (size 4)','Illustrated space book',"Art supplies, he's been sketching a lot"] },
    { id:'pantry-staples', section:'kept', title:'Pantry staples to reorder', summary:'What we reorder most weeks.', label:'List', source:'You told Anna', updated:'Updated May 6',
      preview:['Olive oil','Pasta + rice','Tinned tomatoes','Coffee',"Kids' multivitamins"] },
    { id:'enrolment-form', section:'kept', title:"Theo's school enrolment form", summary:'A PDF you saved with Anna.', label:'Document', source:'You saved this with Anna', updated:'Saved Apr 15', kind:'document',
      preview:['PDF, 3 pages.',"Theo's enrolment form for next term.",'Ask me to pull details out of it or help fill it in.'] },
    { id:'permission-slip', section:'kept', title:'Excursion permission slip', summary:'A photo you saved with Anna.', label:'Photo', source:'You saved this with Anna', updated:'Saved May 8', kind:'photo',
      preview:['Photo from your camera roll.',"Eva's zoo excursion permission slip.",'Due back Friday. Ask me to remind you.'] },

    { id:'eva-swimming', section:'known', title:'Eva has swimming on Tuesdays', summary:'Tuesdays 4-5pm. I use it for afternoon logistics.', label:'Routine', source:'You told Anna', updated:'Confirmed May 2',
      preview:['Eva swims every Tuesday, 4:00-5:00pm.','I use this when sorting out afternoon pickups and checking for clashes.'] },
    { id:'eva-allergy', section:'known', title:'Eva is allergic to peanuts', summary:'Peanuts. I check this before any food suggestions.', label:'Fact', source:'You told Anna', updated:'Confirmed Feb 18',
      preview:['Eva is allergic to peanuts.','I check this before suggesting party food, restaurants, or snacks.'] },
    { id:'theo-teacher', section:'known', title:"Theo's teacher is Ms Wong", summary:'Ms Wong this year. Picked up from a school email.', label:'Fact', source:'From a school email', updated:'Updated Apr 24',
      preview:["Theo's teacher this year is Ms Wong.",'I picked this up from a school email back in February.'] },
    { id:'sports-david', section:'known', title:'Sports tasks go to David', summary:"I route kids' sport tasks to David by default.", label:'Rule', source:'You told Anna', updated:'Updated Apr 30',
      preview:["Kids' sport tasks usually go to David.","When I create a sport-related task, I'll assign it to him unless you tell me otherwise."] },
    { id:'school-pickup', section:'known', title:'School pickup is 3:15pm', summary:'3:15pm on weekdays. I time reminders around it.', label:'Routine', source:'You told Anna', updated:'Confirmed Mar 11',
      preview:['School pickup is 3:15pm on weekdays.','I use this to time reminders and check for conflicts.'] },

    { id:'daily-brief', section:'workflows', title:'Daily brief at 7:00am', summary:'Your morning rundown, every day at 7am.', label:'Active', source:'Runs every morning', updated:'Ran today 7:00am',
      preview:['Every morning at 7:00am.',"Your day's events, anything that needs you, and what I've handled.",'Delivered to WhatsApp.'] },
    { id:'friday-meals', section:'workflows', title:'Friday meal-planning reminder', summary:"A nudge every Friday to plan next week's meals.", label:'Active', source:'You asked Anna to do this', updated:'Next Fri 4:30pm',
      preview:['Every Friday at 4:30pm.',"A reminder to plan next week's meals.",'You asked me to do this on Apr 18.'] },
    { id:'brief-outfit', section:'workflows', title:'Include what to wear in my brief', summary:'I add weather and an outfit suggestion to your brief.', label:'Active', source:'You asked Anna to do this', updated:'Applied today',
      preview:['Part of your daily brief.','I include the weather and a clothing suggestion for the kids.'] },

    { id:'venue-report', section:'made', title:'Birthday venue comparison', summary:'Five party venues near you, compared.', label:'Report', source:'Made by Anna', updated:'Made May 9',
      preview:['Compared 5 party venues near you.','Bounce Blackburn came out on top on price and availability.','Includes costs, capacity, and booking links.'] },
    { id:'holiday-plan', section:'made', title:'July school holiday plan', summary:'Activities lined up for the July school holidays.', label:'Plan', source:'Made by Anna', updated:'Made May 1',
      preview:['A shortlist of activities for the July school holidays.','A mix of camps, free days, and a couple of day trips.','Covers all 9 weekdays.'] },
    { id:'bali-itinerary', section:'made', title:'Bali trip itinerary', summary:'A day-by-day plan for the Bali trip.', label:'Itinerary', source:'Made by Anna', updated:'Made Apr 6',
      preview:['7-day itinerary for the Bali trip.','Day-by-day plan with kid-friendly stops.','Built from your saved packing list and flight dates.'] }
  ];

  // ---- state ----
  let activeSection = 'kept';
  let selectedId = null;

  const screen = document.getElementById('screen');

  function composer(scopedTitle) {
    const label = scopedTitle
      ? '<div class="scoped-label">Asking Anna about <b>' + scopedTitle + '</b></div>'
      : '';
    const placeholder = scopedTitle
      ? 'Ask Anna to explain, fix, forget, or use this…'
      : 'Ask Anna about your memory…';
    return '<div class="composer-wrap">' + label +
      '<div class="composer">' +
        '<button class="icon-btn" aria-label="Attach a document or photo">' + I.paperclip + '</button>' +
        '<input type="text" placeholder="' + placeholder + '" />' +
        '<button class="send-btn" disabled aria-label="Ask Anna">' + I.arrowUp + '</button>' +
      '</div></div>';
  }

  function wireComposer(root) {
    const input = root.querySelector('.composer input');
    const send = root.querySelector('.send-btn');
    if (!input) return;
    input.addEventListener('input', () => { send.disabled = input.value.trim() === ''; });
    send.addEventListener('click', () => { input.value = ''; send.disabled = true; input.focus(); });
  }

  function renderHome() {
    const meta = sections.find(s => s.id === activeSection);
    const items = memories.filter(m => m.section === activeSection);

    const tabs = sections.map(s => {
      const count = memories.filter(m => m.section === s.id).length;
      return '<button class="tab' + (s.id === activeSection ? ' active' : '') + '" data-section="' + s.id + '">' +
        I[s.icon] + '<span class="label">' + s.short + '</span><span class="count">' + count + '</span></button>';
    }).join('');

    const list = items.map(m =>
      '<button class="item" data-id="' + m.id + '">' +
        '<div class="item-row"><div class="item-main">' +
          '<div class="item-meta"><span class="chip">' + m.label + '</span>' +
            '<span class="recency">' + m.updated + '</span></div>' +
          '<div class="item-title">' + m.title + '</div>' +
          '<div class="item-summary">' + m.summary + '</div>' +
        '</div>' + '<span class="chevron">' + I.chevron + '</span></div>' +
      '</button>'
    ).join('');

    screen.innerHTML =
      '<div class="header"><h1 class="page-title">Memory</h1>' +
        '<div class="tabs">' + tabs + '</div></div>' +
      '<div class="list-area"><div class="section-title">' + meta.title + '</div>' + list + '</div>' +
      composer(null);

    screen.querySelectorAll('.tab').forEach(t =>
      t.addEventListener('click', () => { activeSection = t.dataset.section; selectedId = null; renderHome(); }));
    screen.querySelectorAll('.item').forEach(it =>
      it.addEventListener('click', () => { selectedId = it.dataset.id; renderPreview(); }));
    wireComposer(screen);
  }

  function renderPreview() {
    const m = memories.find(x => x.id === selectedId);
    const meta = sections.find(s => s.id === m.section);

    let media = '';
    if (m.kind === 'photo') {
      media = '<div class="photo-block">' + I.image + '</div>';
    } else if (m.kind === 'document') {
      media = '<div class="doc-block"><div class="doc-icon">' + I.file + '</div>' +
        '<div><div class="doc-name">' + m.title + '</div>' +
        '<div class="doc-sub">Tap to open, or ask Anna about it below.</div></div></div>';
    }

    const bullets = m.preview.map(line =>
      '<li><span class="bullet">•</span><span>' + line + '</span></li>').join('');

    screen.innerHTML =
      '<div class="back-row"><button class="back-btn" id="backBtn">' + I.arrowLeft + meta.short + '</button></div>' +
      '<div class="preview-area">' +
        '<div class="item-meta"><span class="chip">' + m.label + '</span>' +
          '<span class="recency">' + m.updated + '</span></div>' +
        '<div class="preview-title">' + m.title + '</div>' +
        media +
        '<div class="preview-card"><ul>' + bullets + '</ul></div>' +
        '<div class="source-line">From: ' + m.source + '</div>' +
      '</div>' +
      composer(m.title);

    screen.querySelector('#backBtn').addEventListener('click', () => { selectedId = null; renderHome(); });
    wireComposer(screen);
  }

  function renderNav() {
    const items = [
      { icon: 'chat', label: 'Chat' },
      { icon: 'calendar', label: 'Today' },
      { icon: 'brain', label: 'Memory', active: true },
      { icon: 'cog', label: 'Settings' }
    ];
    document.getElementById('bottomnav').innerHTML = items.map(n =>
      '<div class="nav-item' + (n.active ? ' active' : '') + '">' + I[n.icon] +
      '<span class="nav-label">' + n.label + '</span></div>'
    ).join('');
  }

  renderNav();
  renderHome();
</script>
</body>
</html>
